[package]
name = "retichat-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
reticulum_rust = { path = "../../../Reticulum-rust", default-features = false, features = ["prns-ble"] }
lxmf_rust = { path = "../../../LXMF-rust", default-features = false }
# The held propagation link's events and uploads (src/distro_outbox.rs, the
# distro outbox); the same package lxmf_rust already builds, not a second copy.
app_links = { path = "../../../app-links" }
# The version lxmf_rust pins: C's fields are rmpv values of its own LXMessage.
rmpv = "=1.0.0"
jni = "0.21"
sha2 = "0.10"
